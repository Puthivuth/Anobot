[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "anobot-backend"
version = "0.1.0"
description = "AnoBot computer vision platform API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2",
  "redis>=5,<6", "boto3>=1.35,<2", "Pillow>=10,<12", "python-multipart>=0.0.12",
  "argon2-cffi>=23.1.0", "pyjwt>=2.9.0", "cryptography>=43.0.0", "ultralytics>=8.3.0"
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
