services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anobot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anobot_dev_password}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anobot -d anobot"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-anobot}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-anobot_minio_dev_secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build: ./backend
    image: anobot-api:latest
    environment:
      DATABASE_URL: postgresql+psycopg://anobot:${POSTGRES_PASSWORD:-anobot_dev_password}@postgres:5432/anobot
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: anobot
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-anobot}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-anobot_minio_dev_secret}
      DEFAULT_GEMINI_MODEL: ${DEFAULT_GEMINI_MODEL:-gemini-2.0-flash}
      TRAINING_DEVICE: ${TRAINING_DEVICE:-cpu}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build: ./frontend
    image: anobot-web:latest
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
volumes:
  postgres_data:
  minio_data:
